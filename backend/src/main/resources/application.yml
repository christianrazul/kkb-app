server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: kkb-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kkb}
    username: ${DB_USERNAME:kkb}
    password: ${DB_PASSWORD:kkb}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  session:
    timeout: 30d
    jdbc:
      initialize-schema: never
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-client-secret}
            redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
            scope:
              - openid
              - profile
              - email

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  time-zone: ${APP_TIME_ZONE:Asia/Manila}
  fx:
    base-url: ${FX_BASE_URL:https://api.frankfurter.dev}
    timeout: ${FX_TIMEOUT:5s}
    prefetch-cron: ${FX_PREFETCH_CRON:0 30 1 * * *}
  mail:
    enabled: ${MAIL_ENABLED:false}
    api-base-url: ${RESEND_API_BASE_URL:https://api.resend.com}
    api-key: ${RESEND_API_KEY:}
    from: ${MAIL_FROM:KKB <invites@mail.kkb-app.space>}
    timeout: ${MAIL_TIMEOUT:5s}
    max-attempts: ${MAIL_MAX_ATTEMPTS:5}
    poll-delay-ms: ${MAIL_POLL_DELAY_MS:30000}
