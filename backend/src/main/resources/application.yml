server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: kkb-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kkb}
    username: ${DB_USERNAME:kkb}
    password: ${DB_PASSWORD:kkb}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  session:
    timeout: 30d
    jdbc:
      initialize-schema: never
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: ${SMTP_CONNECTION_TIMEOUT_MS:5000}
          timeout: ${SMTP_READ_TIMEOUT_MS:5000}
          writetimeout: ${SMTP_WRITE_TIMEOUT_MS:5000}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-client-secret}
            redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
            scope:
              - openid
              - profile
              - email

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  time-zone: ${APP_TIME_ZONE:Asia/Manila}
  fx:
    base-url: ${FX_BASE_URL:https://api.frankfurter.dev}
    timeout: ${FX_TIMEOUT:5s}
    prefetch-cron: ${FX_PREFETCH_CRON:0 30 1 * * *}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:KKB <invites@mail.kkb-app.space>}
    max-attempts: ${MAIL_MAX_ATTEMPTS:5}
    poll-delay-ms: ${MAIL_POLL_DELAY_MS:30000}
